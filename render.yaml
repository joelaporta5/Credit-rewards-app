# Render Blueprint: one web service + one PostgreSQL database.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this GitHub repo. See README "Deploy to Render".
services:
  - type: web
    name: rewards-autopilot
    runtime: python
    # Paid "starter" instance: Free instances sleep after 15 minutes idle and take ~1 minute
    # to wake, which would make the iPhone Shortcut time out and delay Plaid webhooks.
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rewards-autopilot-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: WALLET_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Never change this after connecting accounts: stored Plaid tokens are encrypted with it.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false   # e.g. https://rewards-autopilot.onrender.com (Render asks you during setup)
      - key: TIMEZONE
        value: America/New_York
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"

databases:
  - name: rewards-autopilot-db
    # Paid plan: Free Render Postgres databases expire after 30 days and have no backups.
    plan: basic-256mb
    postgresMajorVersion: "16"
